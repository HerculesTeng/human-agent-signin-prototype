  function stopTest(){ if (ui.timer) { clearInterval(ui.timer); ui.timer = null; } }
  function runTest(){
    stopTest();
    var d = ui.draft, lines;
    if (ui.screen === 'web2') {
      lines = ['GET https://core.api.aigw.loginid.ai/.well-known/openid-configuration  200',
        'Open sign-in: client_id ' + CLIENT_ID + ', PKCE S256',
        '✓ Test customer signed in with a verified email',
        'Callback ' + (d.uris[0] || DEMO['web.uri.0']) + '?code=…  302',
        'POST /oauth2/token  ' + (d.appType === 'web' ? 'client_secret_basic' : 'PKCE, no secret') + '  200',
        '✓ ID token valid: iss, aud, exp, signature',
        '✓ Claims received: sub' + (d.details.Email ? ', email, email_verified' : '') + (d.details.Name ? ', name' : '') + (d.details.Phone ? ', phone_number' : '') + (d.details['Shipping address'] ? ', address' : ''),
        'Passed in 2.4s'];
    } else {
      var on = SCOPES.filter(function(s){ return d.scopes[s.key]; }).map(function(s){ return s.key; }).join(' ');
      lines = ['Test agent calls ' + UCP + '  401 identity_required',
        'GET https://ucp.shops.example/.well-known/oauth-protected-resource/juniper-co  200',
        'Authorize at https://api.aigw.loginid.ai/' + RES + ', PKCE S256',
        '✓ Test customer signed in and approved: ' + on,
        'POST ' + (d.token || DEMO['agent.token']) + '  ' + (d.grant === 'exchange' ? 'token-exchange' : 'jwt-bearer') + ', ' + (d.auth === 'key' ? 'private_key_jwt' : 'client_secret_basic') + '  200',
        '✓ Your CIAM accepted the assertion and issued an access token and a refresh token',
        '✓ AIGW access token issued to the test agent',
        'Test agent retries the UCP call with its token  200',
        'Passed in 3.1s'];
    }
    ui.test = { status:'running', lines:[] }; render();
    var i = 0;
    ui.timer = setInterval(function(){
      ui.test.lines.push(lines[i]); i++;
      if (i >= lines.length) { ui.test.status = 'passed'; stopTest(); }
      render();
    }, 350);
  }

  /* ---------- events ---------- */
  document.addEventListener('click', function(e){
    var el = e.target.closest('[data-act]'); if (!el) return;
    var act = el.getAttribute('data-act');
    if (act === 'cancel-delete-bg') { if (e.target !== el) return; act = 'cancel-delete'; }
    if (el.tagName === 'A') e.preventDefault();
    var d = ui.draft;
    switch (act) {
      case 'home': ui.confirm = null; go('home'); break;
      case 'setup-web': start('web', 'create'); break;
      case 'edit-web': start('web', 'edit'); break;
      case 'setup-agent': start('agent', 'create'); break;
      case 'edit-agent': start('agent', 'edit'); break;
      case 'add-uri': d.uris.push(''); render(); break;
      case 'remove-uri': d.uris.splice(+el.getAttribute('data-i'), 1); render(); break;
      case 'web-next': go('web2'); break;
      case 'web-back': go('web1'); break;
      case 'web-done': d.done = true; saved.web = clone(d); persist(); go('home'); toast('Website sign-in is set up'); break;
      case 'read-meta':
        if (!d.url.trim()) { d.loaded = false; d.issuer = ''; d.token = ''; }
        else { var iss = d.url.trim().replace(/\/\.well-known\/.*$/, '').replace(/\/$/, ''); d.loaded = true; d.issuer = iss; d.token = iss + '/oauth2/token'; }
        render(); break;
      case 'toggle-auto': ui.autoOpen = !ui.autoOpen; render(); break;
      case 'toggle-ex': ui.exOpen = !ui.exOpen; render(); break;
      case 'agent-next1': go('agent2'); break;
      case 'agent-back1': go('agent1'); break;
      case 'agent-next2': go('agent3'); break;
      case 'agent-back2': go('agent2'); break;
      case 'agent-done': d.done = true; d.newDomain = ''; saved.agent = clone(d); persist(); go('home'); toast('AI agent access is set up'); break;
      case 'add-domain':
        var nd = d.newDomain.trim().toLowerCase();
        if (nd && d.domains.indexOf(nd) < 0) d.domains.push(nd);
        d.newDomain = ''; render(); break;
      case 'remove-domain': d.domains = d.domains.filter(function(x){ return x !== el.getAttribute('data-d'); }); render(); break;
      case 'toggle-scope': var k = el.getAttribute('data-k'); d.scopes[k] = !d.scopes[k]; render(); break;
      case 'run-test': runTest(); break;
      case 'copy':
        var text = el.getAttribute('data-copy');
        var done = function(){ el.textContent = 'Copied'; setTimeout(function(){ el.textContent = 'Copy'; }, 1200); };
        try { navigator.clipboard.writeText(text).then(done, function(){ toast('Select the text to copy it'); }); } catch (err) { toast('Select the text to copy it'); }
        break;
      case 'delete-web': ui.confirm = 'web'; ui.typed = ''; renderLayer(); break;
      case 'delete-agent': ui.confirm = 'agent'; ui.typed = ''; renderLayer(); break;
      case 'cancel-delete': ui.confirm = null; renderLayer(); break;
      case 'confirm-delete':
        if (ui.typed.trim().toLowerCase() !== ui.phrase) return;
        saved[ui.confirm] = ui.confirm === 'web' ? blankWeb() : blankAgent(); persist();
        var which = ui.confirm; ui.confirm = null; render(); toast(which === 'web' ? 'Website sign-in deleted' : 'AI agent access deleted'); break;
    }
  });
  document.addEventListener('input', function(e){
    var t = e.target;
    if (t.id === 'del-confirm') {
      ui.typed = t.value;
      var b = document.getElementById('del-go'); if (b) b.disabled = ui.typed.trim().toLowerCase() !== ui.phrase;
      return;
    }
    var path = t.getAttribute('data-field'); if (!path || !ui.draft || t.type === 'checkbox' || t.type === 'radio' || t.tagName === 'SELECT') return;
    setField(path, t.value);
    if (path === 'agent.issuer' || path === 'agent.token') {
      var h = document.getElementById('auto-head'); if (h) h.innerHTML = autoHeader(ui.draft) + (ui.autoOpen ? I.up : I.down);
    }
  });
  document.addEventListener('change', function(e){
    var t = e.target, path = t.getAttribute('data-field'); if (!path || !ui.draft) return;
    if (t.type === 'checkbox') { setField(path, t.checked); if (ui.screen === 'web1') return; }
    else if (t.type === 'radio') setField(path, t.value);
    else if (t.tagName === 'SELECT') setField(path, t.value);
    else return;
    render();
    var again = document.getElementById(t.id); if (again && t.tagName === 'SELECT') again.focus();
  });
  document.addEventListener('focusin', function(e){
    var t = e.target, demo = t.getAttribute && t.getAttribute('data-demo');
    if (!demo || t.value) return;
    t.value = demo; setField(t.getAttribute('data-field'), demo);
    if (t.getAttribute('data-field') === 'agent.issuer' || t.getAttribute('data-field') === 'agent.token') {
      var h = document.getElementById('auto-head'); if (h) h.innerHTML = autoHeader(ui.draft) + (ui.autoOpen ? I.up : I.down);
    }
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && ui.confirm) { ui.confirm = null; renderLayer(); }
    if (e.key === 'Enter' && e.target.id === 'agent.newDomain') { e.preventDefault(); document.querySelector('[data-act="add-domain"]').click(); }
  });

  render();
})();
</script>

</body></html>
